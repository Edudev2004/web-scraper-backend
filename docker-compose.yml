version: "3.8"
services:
  db_web_scraper:
    image: postgres:15
    container_name: web-scraper-cirion
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: web-scraper-cirion
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
